project:
  type: website
  output-dir: _site

website:
  title: "MANO"
  description: "Colombian Sign Language Recognition"
  
  navbar:
    background: "#1a1a2e"
    foreground: "#eaeaea"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Blog"
        href: posts.qmd
    right:
      - text: "Español"
        href: es/index.qmd
      - icon: github
        href: https://github.com/davidrfb/Mano
  
  page-footer:
    center: "MANO - Lengua de Señas Colombiana"
    background: "#1a1a2e"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    highlight-style: github-dark

execute:
  freeze: auto